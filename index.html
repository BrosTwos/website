<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BrosTwos</title>
  <meta name="description" content="Countdown zum nächsten BrosTwos-Video, jeden Sonntag um 14:00 Uhr." />
  <meta name="theme-color" content="#0b0b10" />
  <link rel="icon" href="logo.png" />
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
  <link rel="preload" href="rubik-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <a class="brand" href="https://www.youtube.com/@mcBrosTwos" target="_blank" rel="noopener">
      <img src="logo.png" alt="" width="52" height="52" />
      <span>BrosTwos</span>
    </a>
  </header>

  <main>
    <p class="label">Nächstes Video</p>

    <div class="countdown" role="timer" aria-label="Countdown zum nächsten Video">
      <div><b id="days">00</b><span>Tage</span></div>
      <div><b id="hours">00</b><span>Stunden</span></div>
      <div><b id="minutes">00</b><span>Minuten</span></div>
      <div><b id="seconds">00</b><span>Sekunden</span></div>
    </div>

    <p class="next">am <span id="next-date">Sonntag</span> um 14:00 Uhr</p>

    <section class="video">
      <p class="label">Neuestes Video</p>

      <div class="player" id="player">
        <img id="thumb" alt="" />
        <button id="play" type="button" disabled aria-label="Video abspielen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        </button>
      </div>

      <h2 id="title">Wird geladen …</h2>
      <p class="meta"><span id="date">–</span> · <span id="status">Video wird geladen</span></p>

      <a class="button" id="link" href="https://www.youtube.com/@mcBrosTwos" target="_blank" rel="noopener">Auf YouTube ansehen</a>
      <button class="link" id="refresh" type="button">Aktualisieren</button>
    </section>
  </main>

  <footer>
    <p class="partner">
      <a href="https://www.youtube.com/@Txddi123" target="_blank" rel="noopener">
        <img src="partner.jpg" alt="" width="22" height="22" />
        <span>Txddi</span>
      </a>
    </p>
    <p>© <span id="year">2026</span> BrosTwos · Kein offizielles YouTube-Angebot.</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
